<head>

<title>Parchís</title>
<style>
:root{
  --bg:#1c130b; --felt:#2c1e12; --card:#3a2918; --card2:#4a3520; --line:#654a2c;
  --txt:#f8efe3; --mut:#cdb89d; --gold:#f4c13d; --red:#ff6b6b; --blue:#6cc4e8; --ok:#62d39a;
  --r:14px; --on-gold:#2a1a00; --on-blue:#062a33; --outbg:#262a33;
  --sql:#ecd7b0; --sqd:#b08559;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--txt);font:calc(16px * var(--fs, 1))/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--felt);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:calc(19px * var(--fs, 1));margin:0;flex:1;letter-spacing:.3px;min-width:0}
header h1 small{display:block;font-size:calc(12px * var(--fs, 1));color:var(--mut);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:14px;max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--card2);cursor:pointer}
button:active{transform:scale(.97)}
button[disabled]{opacity:.4}
.btn-gold{background:var(--gold);color:var(--on-gold);font-weight:700}
.btn-red{background:var(--red);color:#fff;font-weight:600}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.icon{position:relative;width:42px;height:42px;padding:0;display:grid;place-items:center;font-size:calc(20px * var(--fs, 1));background:transparent}
.sec{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:14px}
.sec h2{font-size:calc(15px * var(--fs, 1));margin:0 0 10px;color:var(--gold);text-transform:uppercase;letter-spacing:.6px}
label.f{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
label.f:first-of-type{border-top:0}
label.f span{flex:1;min-width:0}
label.f em{display:block;font-style:normal;font-size:calc(12px * var(--fs, 1));color:var(--mut)}
input,select{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input[type=number]{width:90px;text-align:center}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:0}
input.tg{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:999px;background:var(--bg);border:1px solid var(--line);position:relative;flex:none;padding:0;cursor:pointer;transition:background .15s}
input.tg::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:transform .15s,background .15s}
input.tg:checked{background:var(--gold);border-color:var(--gold)}
input.tg:checked::after{transform:translateX(22px);background:var(--on-gold)}
.plist .pr{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.plist .pr input{flex:1;min-width:0}
.plist .pr button{padding:10px 12px}
.side svg{width:34px;height:34px;display:block}
.row{display:flex;gap:10px}
.row>*{flex:1}
.mut{color:var(--mut);font-size:calc(13px * var(--fs, 1))}
.fab{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:692px;margin:0 auto;
  padding:16px;font-size:calc(18px * var(--fs, 1));box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:6}

/* Tablas */
.tbl-wrap{overflow-x:auto;border-radius:var(--r);background:var(--card)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:calc(14px * var(--fs, 1))}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--card2);font-size:calc(13px * var(--fs, 1));max-width:90px;overflow:hidden;text-overflow:ellipsis}
td:first-child,th:first-child{text-align:left;padding-left:10px;color:var(--mut);position:sticky;left:0;background:var(--card)}
th:first-child{background:var(--card2)}

/* Ventanas */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:var(--felt);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;overflow-x:hidden;border-radius:20px 20px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-size:calc(20px * var(--fs, 1))}
.sheet .sub{color:var(--mut);font-size:calc(13px * var(--fs, 1));margin-bottom:12px}
.hrow{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.hrow .top{display:flex;align-items:center;gap:10px}
.hrow .top .n{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .top .n small.wrap{white-space:normal}
.hrow .top .n small{display:block;font-weight:400;color:var(--mut);font-size:calc(12px * var(--fs, 1))}
.closebtn{padding:8px 10px;font-size:calc(13px * var(--fs, 1));background:transparent;border:1px solid var(--line);white-space:nowrap}
.kinds{display:flex;gap:6px;margin-top:8px}
.kinds button{flex:1;min-width:0;overflow-wrap:anywhere;padding:8px 6px;font-size:calc(13px * var(--fs, 1));background:var(--bg);border:1px solid var(--line)}
.kinds button.on{background:var(--gold);color:var(--on-gold);font-weight:700;border-color:var(--gold)}
.sheet .acts{display:flex;gap:10px;margin-top:14px}
.sheet .acts button{flex:1;padding:14px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:999px;font-size:calc(14px * var(--fs, 1));opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.menu button{display:block;width:100%;text-align:left;margin-bottom:8px;background:var(--card)}
.menu .mt{font-size:calc(12px * var(--fs, 1));font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:14px 4px 6px}.menu .mt:first-child{margin-top:4px}
.menu .mg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.menu .mg2 button{margin:0}
.menu button.btn-gold{background:var(--gold);color:var(--on-gold)}
.menu button.btn-red{background:var(--red);color:#fff}
.donate{background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:14px;margin-top:4px;text-align:center}
.donate .dt{font-weight:800;font-size:calc(17px * var(--fs, 1));color:var(--gold)}
.donate .dd{color:var(--mut);font-size:calc(14px * var(--fs, 1));margin:6px 0 12px}
.donate button{width:100%;padding:14px;font-size:calc(16px * var(--fs, 1))}
.copy{text-align:center;color:var(--mut);font-size:calc(12px * var(--fs, 1));padding:8px 0 4px;opacity:.8}
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:6px 0 4px}
.th{padding:0;border-radius:14px;overflow:hidden;border:3px solid transparent;text-align:left;background:none}
.th.on{border-color:var(--gold)}
.th .pv{height:74px;padding:10px;display:flex;gap:6px;align-items:flex-end}
.th .pv i{flex:1;height:38px;border-radius:8px;display:block}
.th .pv b{width:26px;height:26px;border-radius:50%;display:block;flex:none}
.th .tn{padding:8px 10px;font-weight:700;font-size:calc(14px * var(--fs, 1));display:flex;justify-content:space-between}
.bthemes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:6px 0 10px}
.bthemes button{padding:0;border-radius:10px;overflow:hidden;border:3px solid transparent;background:none}
.bthemes button.on{border-color:var(--gold)}
.bthemes .mini{display:grid;grid-template-columns:1fr 1fr;aspect-ratio:1}
.bthemes span{display:block;font-size:calc(11px * var(--fs, 1));padding:3px 0;text-align:center;background:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px}
.chipb{padding:8px 14px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:calc(15px * var(--fs, 1))}
.chipb.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:700}
#menuBtn.dot::after{content:'';position:absolute;top:6px;right:6px;width:11px;height:11px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--felt)}
#updBanner{display:none;background:var(--gold);color:var(--on-gold);font-weight:700;text-align:center;padding:10px 14px;cursor:pointer;font-size:calc(15px * var(--fs, 1))}
#updBanner.on{display:block}
.pf-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pf-av{width:48px;height:48px;border-radius:50%;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;font-weight:800;flex:none}
.pf-rating{font-size:calc(30px * var(--fs, 1));font-weight:800;color:var(--gold);line-height:1}
.pf-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.pf-kpi{background:var(--card);border-radius:12px;padding:10px 12px}
.pf-kpi span{display:block;font-size:calc(12px * var(--fs, 1));color:var(--mut)}
.pf-kpi b{font-size:calc(22px * var(--fs, 1))}
.pf-kpi small,.pf-line small,.pf-t small{font-weight:400;color:var(--mut);font-size:calc(13px * var(--fs, 1))}
.pf-t{font-weight:700;color:var(--gold);margin:6px 0 6px;font-size:calc(14px * var(--fs, 1))}
.pf-box{background:var(--card);border-radius:12px;padding:6px 12px;margin-bottom:10px}
.pf-line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.pf-line:first-child{border-top:0}
.pf-h2h{display:flex;align-items:center;gap:10px;padding:6px 0}
.pf-h2h span{width:30%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-h2h b{width:62px;text-align:right}
.pf-bar{flex:1;height:10px;border-radius:5px;background:var(--red);overflow:hidden;opacity:.9;display:flex}
.pf-bar i{display:block;height:100%;background:var(--ok)}
.pf-bar u{display:block;height:100%;background:var(--mut)}
.pf-months{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:6px}
.pf-months div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.pf-months i{display:block;width:100%;background:var(--card2);border-radius:5px 5px 0 0}
.pf-months small,.pf-months span{font-size:calc(11px * var(--fs, 1));color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:20px}
.rules h4{color:var(--gold);margin:14px 0 4px}
.rules p,.rules li{color:var(--txt);line-height:1.5;margin:4px 0}
.rules ul{padding-left:20px;margin:4px 0}

/* Inicio */
.modes{margin:0 0 14px}
.modes button{padding:12px 4px;font-size:calc(14px * var(--fs, 1))}
.colbtn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 6px!important}
.colbtn svg{width:26px;height:26px;flex:none}
.levels{display:flex;flex-direction:column;gap:6px}
.lvl{display:flex;align-items:center;gap:12px;text-align:left;background:var(--bg);border:1px solid var(--line);padding:10px 12px}
.lvl b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--card2);flex:none}
.lvl span{flex:1;min-width:0;font-weight:700}
.lvl em{display:block;font-style:normal;font-weight:400;color:var(--mut);font-size:calc(12px * var(--fs, 1))}
.lvl small{color:var(--mut);font-size:calc(12px * var(--fs, 1))}
.lvl.on{border-color:var(--gold);background:var(--card2)}
.lvl.on b{background:var(--gold);color:var(--on-gold)}
.res{display:inline-block;min-width:44px;text-align:center;padding:2px 6px;border-radius:6px;background:var(--card2);font-size:calc(12px * var(--fs, 1));font-weight:700;color:var(--txt)}
.res.w{background:var(--ok);color:#06210f}.res.l{background:var(--red);color:#fff}

.res{display:inline-block;min-width:44px;text-align:center;padding:2px 6px;border-radius:6px;background:var(--card2);font-size:calc(12px * var(--fs, 1));font-weight:700;color:var(--txt)}
.res.w{background:var(--ok);color:#06210f}.res.l{background:var(--red);color:#fff}
.cdot{display:inline-block;width:14px;height:14px;border-radius:50%;flex:none;vertical-align:-2px;box-shadow:0 0 0 1.5px rgba(0,0,0,.25)}
.colbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 2px!important;font-size:calc(13px * var(--fs, 1))!important}
.colbtn .cdot{width:22px;height:22px}
.kinds button.colbtn.on{background:var(--card2);color:var(--txt);border:2px solid var(--gold)}
.dice{border:3px solid var(--dc, transparent)}
.lseat{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.lseat:first-of-type{border-top:0}
.lseat .cn{width:70px;flex:none;font-size:calc(14px * var(--fs, 1))}
.lseat .kinds button{flex:none;width:40px;padding:8px 0}
.lseat input{flex:1;min-width:0;width:0}
.lseat .lsx{flex:1}
/* En línea */
.on-code{font-size:calc(46px * var(--fs, 1));font-weight:800;letter-spacing:10px;color:var(--gold);margin:4px 0 12px;font-variant-numeric:tabular-nums}
.on-seat{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.on-seat:first-of-type{border-top:0}
.on-seat .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.on-seat .n small{color:var(--mut);font-weight:400}
.on-seat button{padding:4px 12px}
.on-dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none}
.on-dot.ok{background:var(--ok)}

/* Partida */
body:has(.gm){padding-bottom:calc(10px + env(safe-area-inset-bottom))}
main:has(.gm){padding-top:8px}
.gm{display:flex;flex-direction:column;gap:8px}
.pchips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pchip{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:10px;padding:6px 8px;min-width:0;border:2px solid transparent}
.pchip b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:calc(14px * var(--fs, 1))}
.pchip small{color:var(--mut);font-size:calc(12px * var(--fs, 1));white-space:nowrap}
.pchip.turn{border-color:var(--pc);background:var(--card2)}
.gb{width:100%;max-width:min(100%, calc(100svh - 300px));margin:0 auto;min-width:260px}
.board{position:relative;width:100%;aspect-ratio:1;border-radius:8px;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.pboard{display:block;width:100%;height:100%}
.pz{transition:transform .2s linear}
.pz circle{filter:drop-shadow(0 .35px .4px rgba(0,0,0,.45))}
.pz.moving{filter:drop-shadow(0 1px 1.2px rgba(0,0,0,.5))}
.pz .ring{animation:pulse 1s ease-in-out infinite;filter:none}
.dest{pointer-events:none;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.gs{min-width:0}
.gstatus{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;font-weight:700;padding:9px 10px;background:var(--card);border-radius:12px;min-height:44px}
.gstatus.go{background:var(--card2);box-shadow:inset 0 0 0 2px var(--gold)}
.gstatus.end{background:var(--gold);color:var(--on-gold)}
.drow{display:flex;gap:10px;align-items:stretch;margin-top:8px}
.dice{width:78px;height:78px;flex:none;padding:8px;border-radius:16px;background:#fbfaf6;box-shadow:0 3px 0 #bdb7a8,0 4px 12px rgba(0,0,0,.35)}
.dice[disabled]{opacity:.92}
.dice.go{box-shadow:0 3px 0 #bdb7a8,0 0 0 3px var(--gold),0 4px 14px rgba(0,0,0,.4);animation:nudge 1.6s ease-in-out infinite}
.dice.rolling{animation:shake .14s linear infinite;opacity:1}
@keyframes nudge{0%,80%,100%{transform:none}88%{transform:rotate(-8deg)}94%{transform:rotate(8deg)}}
@keyframes shake{0%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}100%{transform:rotate(-10deg)}}
.pips{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:100%;height:100%;gap:2px}
.pips i{display:block;border-radius:50%;margin:16%}
.pips i.on{background:#22252b}
.glog{flex:1;min-width:0;background:var(--card);border-radius:12px;padding:8px 10px;font-size:calc(14px * var(--fs, 1));line-height:1.35;display:flex;flex-direction:column;justify-content:center;gap:2px}
.glog div{overflow:hidden;text-overflow:ellipsis}
.gacts{display:flex;gap:6px;flex-wrap:wrap}
.gacts button{flex:1 1 auto;padding:12px 8px;min-width:0;font-size:calc(15px * var(--fs, 1))}
/* Horizontal (móvil tumbado) */
@media (orientation: landscape) and (max-height: 600px) {
  header{padding-top:calc(4px + env(safe-area-inset-top));padding-bottom:4px}
  header h1 small{display:inline;margin-left:8px}
  main:has(.gm){max-width:none;padding:6px 14px}
  .gm{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr;gap:8px 16px;align-items:start}
  .gb{grid-row:1 / span 2;grid-column:1;width:calc(100svh - 72px);max-width:none;min-width:0;margin:0}
  .pchips{grid-column:2}
  .gs{grid-column:2}
}
/* Tableta */
@media (min-width: 700px) and (min-height: 700px) {
  main:has(.gm){max-width:1100px}
  .gb{max-width:min(640px, calc(100svh - 320px))}
}
@media (min-width: 900px) and (orientation: landscape) and (min-height: 601px) {
  .gm{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr;gap:12px 24px;align-items:start}
  .gb{grid-row:1 / span 2;width:min(calc(100svh - 120px), 60vw);max-width:none;margin:0}
  .pchips{grid-column:2;grid-template-columns:1fr}
  .gs{grid-column:2}
}
</style>
</head>
<body>
<header>
  <h1 id="title">Parchís<small id="subtitle"></small></h1>
  <button class="icon" id="menuBtn" aria-label="Menú">⋮</button>
</header>
<div id="updBanner" role="button"></div>
<main id="app"></main>
<div id="modal" class="modal hidden"></div>
<div id="toast"></div>

<script src="parchis.js"></script>
<script src="juego.js"></script>
<script>window.APP_ID = 'parchis';</script>
<script src="i18n-en.js"></script>
<script src="i18n-fr.js"></script>
<script src="i18n-de.js"></script>
<script src="i18n-it.js"></script>
<script src="idioma.js"></script>
<script src="masjuegos.js"></script>
<script src="audio-suave.js"></script>
<script src="turno.js"></script>
<script src="contador.js"></script>
<script src="invitacion.js"></script>
<script src="publicas.js"></script>
<script>
'use strict';
/* ================= Estado y persistencia ================= */
const KEY = 'parchis.v1';
const DONATE_URL = 'https://www.paypal.com/ncp/payment/KJCPZWMUM3JXG';
// En la app Android (Capacitor) la navegación a otra web se abre en el navegador del sistema
function openExternal(url) {
  if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) { location.href = url; return; }
  const w = window.open(url, '_blank', 'noopener');
  if (!w) location.href = url;
}
/* ================= Temas de color ================= */

  madera:   { name: 'Madera',    bg:'#1c130b', felt:'#2c1e12', card:'#3a2918', card2:'#4a3520', line:'#654a2c', txt:'#f8efe3', mut:'#cdb89d', gold:'#f4c13d', onGold:'#2a1e00', red:'#ff7166', blue:'#71c2f0', onBlue:'#06233a', ok:'#74d39a', outbg:'#2b2620' },

  try { const U = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AppUpdater; if (U && U.setSystemBars) U.setSystemBars({ color: t.felt, light: key === 'claro' }).catch(() => {}); } catch (e) {}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } }

const DEF_DRAFT = () => ({ mode: 'ai', ai: { name: '', color: 0, rivals: 3, level: 2, bots: ['', '', ''] }, local: { level: 2, seats: [{ t: 'p', name: '' }, { t: 'p', name: '' }, { t: 'm', name: '' }, { t: 'm', name: '' }] } });

/* ================= Utilidades UI ================= */

}

/* ---------- Jugadores habituales ---------- */
// Nombres de personas de una partida guardada (en línea, solo el tuyo)
const gameNames = a => (a.seats || []).filter(s => !s.ai && (a.mode !== 'online' || s.me)).map(s => s.name);
function rosterSorted() {
  const c = {}; S.archive.forEach(a => gameNames(a).forEach(n => { const k = nkey(n); c[k] = (c[k] || 0) + 1; }));
  return S.roster.slice().sort((a, b) => (c[nkey(b)] || 0) - (c[nkey(a)] || 0) || a.localeCompare(b, 'es'));
}
function renameEverywhere(oldName, newName) {
  const k = nkey(oldName);
  const fix = g => { if (!g || !g.seats) return; g.seats.forEach(s => { if (!s.ai && nkey(s.name) === k) s.name = newName; }); };
  S.archive.forEach(fix); fix(S.game);
  if (nkey(S.draft.ai.name) === k) S.draft.ai.name = newName;
  S.draft.local.seats.forEach(s => { if (nkey(s.name) === k) s.name = newName; });
}
function openRoster() {
  const games = {}; S.archive.forEach(a => gameNames(a).forEach(n => { const k = nkey(n); games[k] = (games[k] || 0) + 1; }));
  const list = rosterSorted();
  openModal(`<h3>👥 Jugadores habituales</h3>
    <div class="sub">Corrige un nombre y se cambia también en el historial y la clasificación. Si escribes el nombre de otro jugador de la lista, se <b>unen</b> (útil para «Tere» y «Teresa»).</div>
    ${list.map((n, i) => `<div class="hrow"><div class="top">
      <input type="text" maxlength="18" value="${esc(n)}" data-ro="${i}" data-orig="${esc(n)}" style="flex:1;min-width:0">
      <span class="mut" style="white-space:nowrap">${games[nkey(n)] || 0} part.</span>
      ${games[nkey(n)] ? `<button class="closebtn" data-pstat="${esc(n)}" aria-label="Ver ficha">📊</button>` : ''}
      <button class="closebtn" data-rodel="${esc(n)}" aria-label="Quitar">✕</button></div></div>`).join('') || '<div class="empty">Aún no hay jugadores guardados.</div>'}
    <div class="hrow"><div class="top"><input type="text" maxlength="18" id="roNew" placeholder="Nuevo jugador" style="flex:1;min-width:0"><button class="closebtn" id="roAdd">＋ Añadir</button></div></div>
    <div class="mut">Quitar a alguien de la lista no borra sus partidas del historial.</div>
    <div class="acts"><button class="btn-ghost" id="roC">Cancelar</button><button class="btn-gold" id="roS">Guardar</button></div>`);
  const pending = { removed: new Set() };
  $('#roC').onclick = () => { closeModal(); render(); };
  document.querySelectorAll('[data-pstat]').forEach(b => b.onclick = () => openPlayer(b.dataset.pstat, openRoster));
  document.querySelectorAll('[data-rodel]').forEach(b => b.onclick = () => { pending.removed.add(nkey(b.dataset.rodel)); b.closest('.hrow').style.display = 'none'; });
  const readEdits = () => [...document.querySelectorAll('[data-ro]')].map(el => ({ o: el.dataset.orig, v: cleanName(el.value) }));
  const applyRoster = (edits) => {
    const merges = [];
    edits.forEach(({ o, v }) => {
      if (pending.removed.has(nkey(o)) || !v || v === o) return;
      const target = S.roster.find(x => nkey(x) === nkey(v) && nkey(x) !== nkey(o));
      if (target) merges.push(o + ' → ' + target);
      renameEverywhere(o, target || v);
      S.roster = S.roster.filter(x => nkey(x) !== nkey(o));
      if (!target) S.roster.push(v);
    });
    S.roster = S.roster.filter(x => !pending.removed.has(nkey(x)));
    return merges;
  };
  $('#roAdd').onclick = () => {
    const v = cleanName($('#roNew').value); if (!v) return;
    if (S.roster.some(x => nkey(x) === nkey(v))) { toast('Ya está en la lista'); return; }
    applyRoster(readEdits()); S.roster.push(v); save(); openRoster();
  };
  $('#roS').onclick = () => {
    const edits = readEdits();
    const willMerge = edits.some(({ o, v }) => v && v !== o && !pending.removed.has(nkey(o)) && S.roster.some(x => nkey(x) === nkey(v) && nkey(x) !== nkey(o)));
    const go = () => { const m = applyRoster(edits); save(); closeModal(); render(); toast(m.length ? 'Jugadores unidos' : 'Guardado'); };
    if (willMerge) confirmBox('Unir jugadores', 'Las partidas de los dos nombres pasarán a contar como un solo jugador en la clasificación. No se puede deshacer.', 'Unir', go);
    else go();
  };
}

/* ---------- Lista de partidas ---------- */
function archiveRow(a, i) {
  const dt = new Date(a.finished || a.created);
  const w = (a.seats || []).find(s => s.c === a.orden[0]) || {};
  const me = (a.seats || []).find(s => s.me);
  let cls = '', txt = '🏆 ' + (w.name || '');
  if (me) { const pos = a.orden.indexOf(me.c) + 1; cls = pos === 1 ? 'w' : pos === a.orden.length ? 'l' : ''; txt = pos === 1 ? 'Victoria' : pos + 'º'; }
  const who = a.orden.map(c => { const s = a.seats.find(x => x.c === c) || {}; return (s.ai ? '🤖' : '') + (s.name || COL[c].n); }).join(' · ');
  return `<div class="hrow" data-arch="${i}" style="cursor:pointer"><div class="top"><div class="n">${a.orden.map(c => dot(c)).join('')} ${esc(who)}<small>${dt.toLocaleDateString('es-ES')} ${dt.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })} · ${a.mode === 'ai' ? 'contra la máquina' : a.mode === 'online' ? 'en línea' : 'entre amigos'} · ${a.n || 0} tiradas</small></div><span class="res ${cls}">${esc(txt)}</span></div></div>`;
}
function archiveHtml(max) { return S.archive.slice(0, max || 5).map(archiveRow).join(''); }

/* ---------- Tienda: GitHub (actualizador propio) o Google Play ---------- */
let STORE = 'github';
const PLAY_URL = 'https://play.google.com/store/apps/details?id=com.itcanarias.parchis';
const storeReady = (async () => {
  try { const U = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AppUpdater; if (U && U.info) { const r = await U.info(); if (r && r.store === 'play') STORE = 'play'; } } catch (e) {}
})();
const isPlay = () => STORE === 'play';
/* ---------- Actualizaciones ---------- */
function cmpVer(a, b) { const x = a.split('.').map(Number), y = b.split('.').map(Number); for (let i = 0; i < 3; i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d; } return 0; }
async function checkUpdates(manual) {
  if (manual) openModal('<h3>🔄 Buscando actualizaciones…</h3><div class="sub">Un momento.</div>');
  try {
    const r = await fetch('https://api.github.com/repos/' + REPO + '/releases/latest', { cache: 'no-store', headers: { Accept: 'application/vnd.github+json' } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const v = String(j.tag_name || '').replace(/^v/, '');
    const apk = (j.assets || []).find(a => /\.apk$/i.test(a.name));
    S.lastUpdateCheck = Date.now(); save();
    if (!/^\d+\.\d+\.\d+$/.test(v) || !apk) { if (manual) showUpdMsg('No hay ninguna versión publicada todavía.'); return; }
    if (cmpVer(v, APP_VERSION) > 0) {
      S.updAvail = { v, url: apk.browser_download_url, page: j.html_url, note: (j.body || '').split('\n')[0] }; save(); refreshUpdBadge();
      // el aviso grande sale solo una vez por versión; la marca se queda hasta actualizar
      const busy = !$('#modal').classList.contains('hidden');
      if (manual || (!busy && S.updNotified !== v)) { S.updNotified = v; save(); openUpdAvail(); }
    } else {
      S.updAvail = null; save(); refreshUpdBadge();
      if (manual) showUpdMsg(`Tienes la última versión (v${APP_VERSION}).`, '✅');
    }
  } catch (e) {
    if (manual) showUpdMsg('No se pudo comprobar. Revisa que tengas conexión a internet.', '⚠️');
  }
}
function hasUpd() { return !isPlay() && isNative() && !!(S.updAvail && cmpVer(S.updAvail.v, APP_VERSION) > 0); }
function openUpdAvail() { if (hasUpd()) showUpdate(S.updAvail.v, S.updAvail.url, S.updAvail.page, S.updAvail.note); }
function refreshUpdBadge() {
  const on = hasUpd();
  $('#menuBtn').classList.toggle('dot', on);
  const b = $('#updBanner');
  b.classList.toggle('on', on);
  if (on) b.innerHTML = `🎉 Nueva versión v${esc(S.updAvail.v)} disponible · <u>Actualizar</u>`;
}
async function autoCheckUpdates() {
  await storeReady;
  if (isPlay()) { if (S.updAvail) { S.updAvail = null; save(); refreshUpdBadge(); } return; }
  if (!isNative() || !navigator.onLine) return;
  if (!S.lastUpdateCheck || Date.now() - S.lastUpdateCheck > 3600e3) checkUpdates(false);
}
function showUpdMsg(t, icon) { openModal(`<h3>${icon || 'ℹ️'} Actualizaciones</h3><div class="sub">${esc(t)}</div><div class="acts"><button class="btn-gold" id="uOk">Vale</button></div>`); $('#uOk').onclick = closeModal; }
function showUpdate(v, url, page, note) {
  openModal(`<h3>🎉 Nueva versión disponible</h3>
    <div class="sub">Tienes la v${APP_VERSION} y ya está la <b>v${esc(v)}</b>.${note ? '<br>' + esc(note.replace(/^v[\d.]+:\s*/, 'Novedades: ')) : ''}<br><br>Tus partidas, el historial y los colores se conservan.</div>
    <div id="uProg" class="mut" style="min-height:1.2em"></div>
    <div class="acts"><button class="btn-ghost" id="uLater">Más tarde</button><button class="btn-gold" id="uGo">Actualizar ahora</button></div>`);
  $('#uLater').onclick = closeModal;
  $('#uGo').onclick = () => installUpdate(url, page);
}
async function installUpdate(url, page) {
  if (!String(url).startsWith('https://github.com/' + REPO + '/releases/download/')) { toast('Descarga no válida'); return; }
  const U = isNative() && window.Capacitor.Plugins && window.Capacitor.Plugins.AppUpdater;
  if (!U) { openExternal(page || ('https://github.com/' + REPO + '/releases/latest')); return; }
  const prog = $('#uProg'), go = $('#uGo');
  try {
    const { allowed } = await U.canInstall();
    if (!allowed) {
      openModal(`<h3>Un permiso, solo la primera vez</h3><div class="sub">Android necesita que permitas a Parchís instalar su actualización.<br><br>Pulsa <b>Abrir ajustes</b>, activa <b>«Permitir de esta fuente»</b>, vuelve atrás y pulsa otra vez <b>Actualizar</b>.</div>
        <div class="acts"><button class="btn-ghost" id="pNo">Cancelar</button><button class="btn-gold" id="pSet">Abrir ajustes</button></div>`);
      $('#pNo').onclick = closeModal;
      $('#pSet').onclick = async () => { closeModal(); try { await U.openInstallSettings(); } catch (e) { toast('Ábrelo en Ajustes → Aplicaciones → Parchís'); } };
      return;
    }
    go.disabled = true; go.textContent = 'Descargando…'; prog.textContent = 'Descargando 0%';
    const h = await U.addListener('progress', d => { prog.textContent = 'Descargando ' + d.pct + '%'; });
    await U.downloadAndInstall({ url });
    try { h.remove(); } catch (e) {}
    prog.textContent = 'Descarga completa. Pulsa «Actualizar» en la ventana de Android.';
    go.textContent = 'Actualizar ahora'; go.disabled = false;
  } catch (e) {
    prog.textContent = String(e && e.message || e);
    go.textContent = 'Reintentar'; go.disabled = false;
  }
}

/* ---------- Compartir resultados como imagen ---------- */
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#000'; }
function drawShareImage({ title, subtitle, cols, rows, note }) {
  const W = 1080, P = 56, rowH = 92, headH = 70;
  const H = P + 70 + 50 + 40 + headH + rows.length * rowH + 40 + (note ? 50 : 0) + 60 + P;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const bg = cssVar('--bg'), card = cssVar('--card'), card2 = cssVar('--card2'), txt = cssVar('--txt'), mut = cssVar('--mut'), gold = cssVar('--gold'), line = cssVar('--line');

const isNative = () => !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());

const SAFE_ID = /^[A-Za-z0-9_-]{1,40}$/;
const num = (v, d) => { const n = Number(v); return Number.isFinite(n) ? Math.round(n) : d; };

    const c = num(s.c, -1); if (c < 0 || c > 3 || seen.has(c)) return null; seen.add(c);
    out.push({ c, name: cleanName(s.name) || COL[c].n, ai: !!s.ai, level: s.ai ? clampN(s.level, 1, 3, 2) : undefined, me: !!s.me || undefined });

}

function cleanStats(s) { s = s && typeof s === 'object' ? s : {}; return { comidas: cleanArr4(s.comidas), comido: cleanArr4(s.comido), metas: cleanArr4(s.metas), seises: cleanArr4(s.seises), tiradas: clampN(s.tiradas, 0, 1e6, 0) }; }
// Partida del historial: solo datos válidos (ids seguros, colores y números de verdad, textos limpios) o null
function cleanGame(a) {
  if (!a || typeof a !== 'object') return null;
  const seats = cleanSeats(a.seats); if (!seats) return null;
  const cols = seats.map(s => s.c);
  const orden = Array.isArray(a.orden) ? a.orden.map(Number) : [];
  if (orden.length !== cols.length || new Set(orden).size !== orden.length || !orden.every(c => cols.includes(c))) return null;
  const out = { id: SAFE_ID.test(String(a.id)) ? String(a.id) : uid(), created: num(a.created, Date.now()), mode: ['ai', 'local', 'online'].includes(a.mode) ? a.mode : 'local',
    seats, orden, stats: cleanStats(a.stats), n: clampN(a.n, 0, 1e6, 0),
    metas: (Array.isArray(a.metas) ? a.metas : []).filter(m => Array.isArray(m) && cols.includes(Number(m[0]))).map(m => [Number(m[0]), clampN(m[1], 0, 4, 0)]) };

  st.n = clampN(t.n, 0, 1e6, 0); st.stats = cleanStats(t.stats);

function mergeBackup(b) {

  S.archive = S.archive.concat(nuevas).sort((x, y) => (y.finished || y.created || 0) - (x.finished || x.created || 0)).slice(0, MAX_ARCHIVE);
  const g = !S.game && cleanLive(b.game); if (g) S.game = g;

/* Copia automática (solo app Android):
   - en la memoria interna de la app: Android la incluye en su copia de seguridad de Google y la devuelve al reinstalar o cambiar de móvil;
   - en Documentos/Parchis del móvil, si Android lo permite. */
const AUTO_FILE = 'parchis-copia-auto.json';
let autoBackupBusy = false;
async function autoBackup(force) {
  if (!isNative() || autoBackupBusy) return;
  if (!S.archive.length && !S.game) return;
  if (!force && S.lastAutoBackup && Date.now() - S.lastAutoBackup < 3600e3) return;
  autoBackupBusy = true;
  try {
    const { Filesystem } = window.Capacitor.Plugins, data = backupJSON();
    await Filesystem.writeFile({ path: AUTO_FILE, data, directory: 'DATA', encoding: 'utf8' });
    try { await Filesystem.writeFile({ path: 'Parchis/' + AUTO_FILE, data, directory: 'DOCUMENTS', encoding: 'utf8', recursive: true }); S.autoBackupDocs = true; }
    catch (e) { S.autoBackupDocs = false; }
    S.lastAutoBackup = Date.now(); save();
  } catch (e) { /* sin copia esta vez; se reintenta más tarde */ }
  autoBackupBusy = false;
}
// Tras reinstalar: si la app está vacía y hay una copia, ofrecer recuperarla
async function offerRestore() {
  if (!isNative() || S.archive.length || S.game || S.restoreOffered) return;
  const { Filesystem } = window.Capacitor.Plugins;
  let b = null;

    try { const r = await Filesystem.readFile({ path, directory, encoding: 'utf8' }); const j = JSON.parse(r.data); if (validBackup(j) && (j.archive.length || j.game)) { b = j; break; } } catch (e) {}
  }

}

function importBackup() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json,text/plain';
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      let b;
      try { b = JSON.parse(rd.result); } catch (e) { b = null; }
      if (!validBackup(b)) { toast('Ese archivo no es una copia de Parchís'); return; }
      const have = new Set(S.archive.map(a => a.id));
      const nuevas = b.archive.slice(0, MAX_ARCHIVE).map(a => cleanGame(a)).filter(a => a && !have.has(a.id));
      const restoreGame = !S.game && !!cleanLive(b.game);
      confirmBox('Importar copia', `Se añadirán ${nuevas.length} partida${nuevas.length === 1 ? '' : 's'} nueva${nuevas.length === 1 ? '' : 's'} al historial (las que ya tienes no se duplican)${restoreGame ? ' y se recuperará la partida que estaba en curso' : ''}.`, 'Importar', () => {
        const n = mergeBackup(b);
        save(); render(); toast(n + ' partidas importadas'); autoBackup(true); openArchive('partidas');
      });
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* ---------- Clasificación, jornadas y partidas ---------- */
const JORNADA_HOUR = 6;      // la jornada empieza a las 6:00 (una noche larga cuenta como un solo día)
const RANK_C = 10;           // partidas "virtuales" con las que se ajusta la valoración
const RANK_MIN = 5;          // con menos partidas, la valoración se marca como provisional
function jornadaKey(ts) { const d = new Date(ts - JORNADA_HOUR * 3600e3); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function jornadaLabel(k) { const [y, m, d] = k.split('-').map(Number); const s = new Date(y, m - 1, d).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); return s.charAt(0).toUpperCase() + s.slice(1); }
const fmt1 = v => (Math.round(v * 10) / 10).toLocaleString('es-ES');
const medal = i => ['🥇', '🥈', '🥉'][i] || (i + 1) + '.';

// Resultado de una partida terminada: puesto y puntos de cada jugador (la máquina ocupa puesto, pero no entra en el ranking)
function gameResult(a) {
  if (!a || !Array.isArray(a.orden) || a.orden.length < 2 || !Array.isArray(a.seats)) return null;
  const N = a.orden.length, st = a.stats || {};
  const level = (a.seats.find(s => s.ai) || {}).level || null;
  return {
    ts: a.finished || a.created, N, n: a.n || 0, mode: a.mode, level,
    rows: a.orden.map((c, i) => { const s = a.seats.find(x => x.c === c) || { name: COL[c].n, ai: true };
      return { key: nkey(s.name), name: String(s.name).trim(), c, ai: !!s.ai, level: s.level || null, pos: i + 1, win: i === 0,
        pts: Math.round(100 * (N - 1 - i) / (N - 1)) / 10,
        comidas: (st.comidas || [])[c] || 0, comido: (st.comido || [])[c] || 0, seises: (st.seises || [])[c] || 0 }; })
  };
}
function aggregate(results) {
  const m = {};
  results.forEach(g => g.rows.forEach(r => {
    if (r.ai) return;
    const o = m[r.key] || (m[r.key] = { name: r.name, pj: 0, g: 0, pts: 0, pos: 0, comidas: 0, comido: 0 });
    o.name = r.name; o.pj++; o.g += r.win ? 1 : 0; o.pts += r.pts; o.pos += r.pos; o.comidas += r.comidas; o.comido += r.comido;
  }));
  const list = Object.values(m);
  const totPj = list.reduce((a, o) => a + o.pj, 0), mean = totPj ? list.reduce((a, o) => a + o.pts, 0) / totPj : 5;
  list.forEach(o => { o.avg = o.pts / o.pj; o.rating = (o.pts + RANK_C * mean) / (o.pj + RANK_C); o.avgPos = o.pos / o.pj; });
  return list;
}
const doneGames = () => S.archive.map(a => ({ a, r: gameResult(a) })).filter(x => x.r);

/* ---------- Ficha de jugador ---------- */
function playerStats(key) {
  const all = doneGames();
  const games = [];
  all.forEach(({ r }) => { const me = r.rows.find(x => x.key === key && !x.ai); if (me) games.push({ ts: r.ts, me, r }); });
  if (!games.length) return null;
  games.sort((x, y) => x.ts - y.ts);
  let best = 0, cur = 0; games.forEach(g => { cur = g.me.win ? cur + 1 : 0; best = Math.max(best, cur); });
  const rank = aggregate(all.map(x => x.r)).sort((a, b) => (b.rating - a.rating) || (b.g - a.g) || (b.pj - a.pj));
  const ri = rank.findIndex(o => nkey(o.name) === key);
  const h2h = {}, lv = {};
  games.forEach(g => g.r.rows.forEach(o => {
    if (o.key === key && !o.ai) return;
    if (o.ai) return;
    const h = h2h[o.key] || (h2h[o.key] = { name: o.name, ahead: 0, behind: 0 }); h.name = o.name; if (g.me.pos < o.pos) h.ahead++; else h.behind++;
  }));
  games.filter(g => g.r.mode === 'ai').forEach(g => { const L = g.r.level || 2, v = lv[L] || (lv[L] = { g: 0, pj: 0 }); v.pj++; if (g.me.win) v.g++; });
  const monthKey = ts => { const d = new Date(ts - JORNADA_HOUR * 3600e3); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); };
  const byMonth = {}; all.forEach(x => (byMonth[monthKey(x.r.ts)] = byMonth[monthKey(x.r.ts)] || []).push(x.r));
  const months = [...new Set(games.map(g => monthKey(g.ts)))].sort().slice(-6).map(m => {
    const o = aggregate(byMonth[m]).find(z => nkey(z.name) === key);
    const [y, mm] = m.split('-').map(Number);
    return { label: new Date(y, mm - 1, 1).toLocaleDateString('es-ES', { month: 'short' }).replace('.', ''), v: o ? o.rating * 10 : 0 };
  });
  const sum = f => games.reduce((a, g) => a + f(g), 0);
  return {
    name: rank[ri] ? rank[ri].name : key, rankPos: ri + 1, rating: rank[ri] ? rank[ri].rating * 10 : 0,
    pj: games.length, g: sum(g => g.me.win ? 1 : 0), avgPos: sum(g => g.me.pos) / games.length, best, cur,
    comidas: sum(g => g.me.comidas), comido: sum(g => g.me.comido), seises: sum(g => g.me.seises), since: games[0].ts, lv,
    h2h: Object.values(h2h).sort((a, b) => (b.ahead + b.behind) - (a.ahead + a.behind)).slice(0, 8), months
  };
}
function openPlayer(name, back) {
  const st = playerStats(nkey(name));
  if (!st) { toast('Aún no hay partidas terminadas de ' + name); return; }
  const ini = st.name.split(/\s+/).map(w => w[0] || '').join('').slice(0, 2).toUpperCase() || st.name.slice(0, 2).toUpperCase();
  const since = new Date(st.since).toLocaleDateString('es-ES', { month: 'short', year: 'numeric' }).replace('.', '');
  const kpi = (l, v, sub) => `<div class="pf-kpi"><span>${l}</span><b>${v}${sub ? ` <small>${sub}</small>` : ''}</b></div>`;
  const line = (ic, l, v) => `<div class="pf-line"><span>${ic} ${l}</span><b>${v}</b></div>`;
  const maxM = Math.max(10, ...st.months.map(m => m.v));
  const lvs = Object.keys(st.lv).sort();
  openModal(`
    <div class="pf-head"><div class="pf-av">${esc(ini)}</div>
      <div style="flex:1;min-width:0"><h3 style="margin:0">${esc(st.name)}</h3><div class="mut">${st.rankPos ? st.rankPos + 'º en el ranking · ' : ''}desde ${esc(since)}</div></div>
      <div style="text-align:right"><div class="pf-rating">${Math.round(st.rating)}</div><div class="mut" style="font-size:calc(11px * var(--fs, 1))">valoración</div></div></div>
    <div class="pf-kpis">
      ${kpi('Partidas', st.pj)}${kpi('Victorias', st.g, Math.round(st.g / st.pj * 100) + '%')}
      ${kpi('Puesto medio', fmt1(st.avgPos) + 'º')}${kpi('Comidas por partida', fmt1(st.comidas / st.pj))}
    </div>
    <div class="pf-t">Rachas y jugadas</div>
    <div class="pf-box">
      ${line('🔥', 'Mejor racha', st.best + (st.best === 1 ? ' victoria' : ' victorias seguidas'))}
      ${line('📈', 'Racha actual', st.cur ? st.cur + (st.cur === 1 ? ' victoria' : ' victorias') : '—')}
      ${line('🍽', 'Fichas comidas', st.comidas)}
      ${line('😵', 'Veces que le han comido', st.comido)}
      ${line('🎲', 'Seises sacados', st.seises)}
    </div>
    ${lvs.length ? `<div class="pf-t">Contra la máquina</div><div class="pf-box">${lvs.map(l => line('🤖', LEVELS[l] ? LEVELS[l].name : 'Nivel ' + l, st.lv[l].g + ' de ' + st.lv[l].pj + ' <small>(' + Math.round(st.lv[l].g / st.lv[l].pj * 100) + '%)</small>')).join('')}</div>` : ''}
    ${st.h2h.length ? `<div class="pf-t">Cara a cara <small>(por delante – por detrás)</small></div><div class="pf-box">` + st.h2h.map(h => `
      <div class="pf-h2h"><span>${esc(h.name)}</span><div class="pf-bar"><i style="width:${Math.round(h.ahead / (h.ahead + h.behind) * 100)}%"></i></div><b>${h.ahead}–${h.behind}</b></div>`).join('') + '</div>' : ''}
    ${st.months.length > 1 ? `<div class="pf-t">Valoración por mes</div><div class="pf-box"><div class="pf-months">` + st.months.map((m, i) => `
      <div><small>${Math.round(m.v)}</small><i style="height:${Math.max(4, Math.round(m.v / maxM * 70))}px;${i === st.months.length - 1 ? 'background:var(--gold)' : ''}"></i><span>${esc(m.label)}</span></div>`).join('') + '</div></div>' : ''}
    <button class="btn-ghost" id="pfShare" style="width:100%;margin-top:12px">📤 Compartir ficha como imagen</button>
    <div class="acts"><button class="btn-gold" id="pfBack">${back ? '‹ Volver' : 'Cerrar'}</button></div>`);
  $('#pfBack').onclick = () => back ? back() : closeModal();
  $('#pfShare').onclick = () => shareImage(drawShareImage({
    title: 'Ficha de ' + st.name, subtitle: (st.rankPos ? st.rankPos + 'º en el ranking · ' : '') + 'valoración ' + Math.round(st.rating),
    cols: ['', 'Estadística', 'Valor'],
    rows: [['🎲', 'Partidas', st.pj], ['🏆', 'Victorias', st.g + ' (' + Math.round(st.g / st.pj * 100) + '%)'], ['📊', 'Puesto medio', fmt1(st.avgPos) + 'º'],
      ['🍽', 'Fichas comidas', st.comidas], ['😵', 'Le han comido', st.comido], ['🔥', 'Mejor racha', st.best], ['6️⃣', 'Seises', st.seises]],
    note: st.h2h.length ? 'Cara a cara: ' + st.h2h.slice(0, 3).map(h => h.name + ' ' + h.ahead + '–' + h.behind).join(' · ') : ''
  }), 'parchis-' + nkey(st.name).replace(/[^a-z0-9]+/g, '-') + '.png', 'Mis estadísticas de Parchís 🎲');
}

/* ---------- Récords ---------- */
function computeRecords() {
  const games = doneGames().sort((x, y) => x.r.ts - y.r.ts);
  if (!games.length) return [];
  const fd = ts => new Date(ts).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }).replace('.', '');
  const recs = [];
  const top = obj => { let best = null; for (const k in obj) if (!best || obj[k].v > best.v) best = obj[k]; return best; };
  const people = r => r.rows.filter(x => !x.ai);
  const streak = {}, cur = {};
  games.forEach(({ r }) => people(r).forEach(x => { cur[x.key] = x.win ? (cur[x.key] || 0) + 1 : 0; if (!streak[x.key] || cur[x.key] > streak[x.key].v) streak[x.key] = { who: x.name, v: cur[x.key] }; }));
  const s1 = top(streak); if (s1 && s1.v > 1) recs.push({ ic: '🔥', t: 'Mejor racha de victorias', who: s1.who, val: s1.v + ' seguidas' });
  const tot = f => { const m = {}; games.forEach(({ r }) => people(r).forEach(x => { const v = f(x, r); if (!v) return; const o = m[x.key] || (m[x.key] = { who: x.name, v: 0 }); o.v += v; o.who = x.name; })); return top(m); };
  const w = tot(x => x.win ? 1 : 0); if (w) recs.push({ ic: '🏆', t: 'Más victorias', who: w.who, val: w.v });
  const pj = tot(() => 1); if (pj) recs.push({ ic: '🎲', t: 'Más partidas jugadas', who: pj.who, val: pj.v });
  const cm = tot(x => x.comidas); if (cm) recs.push({ ic: '🍽', t: 'Más fichas comidas en total', who: cm.who, val: cm.v });
  const hard = tot((x, r) => x.win && r.mode === 'ai' && r.level === 3 ? 1 : 0); if (hard) recs.push({ ic: '🤖', t: 'Más victorias contra la máquina difícil', who: hard.who, val: hard.v });
  let eat = null, eaten = null, six = null;
  games.forEach(({ r }) => people(r).forEach(x => {
    if (x.comidas && (!eat || x.comidas > eat.v)) eat = { who: x.name, v: x.comidas, ts: r.ts };
    if (x.comido && (!eaten || x.comido > eaten.v)) eaten = { who: x.name, v: x.comido, ts: r.ts };
    if (x.seises && (!six || x.seises > six.v)) six = { who: x.name, v: x.seises, ts: r.ts };
  }));
  if (eat) recs.push({ ic: '🦈', t: 'Más comidas en una partida', who: eat.who, val: eat.v, sub: fd(eat.ts) });
  if (eaten && eaten.v > 1) recs.push({ ic: '😵', t: 'Más veces comido en una partida', who: eaten.who, val: eaten.v, sub: fd(eaten.ts) });
  if (six) recs.push({ ic: '6️⃣', t: 'Más seises en una partida', who: six.who, val: six.v, sub: fd(six.ts) });
  const byN = games.slice().sort((x, y) => y.r.n - x.r.n), L = byN[0], C = byN[byN.length - 1];
  if (L.r.n) recs.push({ ic: '⏳', t: 'Partida más larga', who: 'Ganó ' + L.r.rows[0].name, val: L.r.n + ' tiradas', sub: fd(L.r.ts) });
  if (games.length > 1 && C.r.n) recs.push({ ic: '⚡', t: 'Partida más corta', who: 'Ganó ' + C.r.rows[0].name, val: C.r.n + ' tiradas', sub: fd(C.r.ts) });
  const byDay = {}; games.forEach(({ r }) => (byDay[jornadaKey(r.ts)] = byDay[jornadaKey(r.ts)] || []).push(r));
  let bigDay = null, dayWins = null;
  for (const k in byDay) {
    const list = byDay[k]; if (!bigDay || list.length > bigDay.v) bigDay = { v: list.length, k };
    const wn = {}; list.forEach(r => { const x = r.rows[0]; if (x.ai) return; const o = wn[x.key] || (wn[x.key] = { who: x.name, v: 0 }); o.v++; });
    const t = top(wn); if (t && (!dayWins || t.v > dayWins.v)) dayWins = Object.assign({}, t, { k });
  }
  if (dayWins && dayWins.v > 1) recs.push({ ic: '👑', t: 'Más victorias en una jornada', who: dayWins.who, val: dayWins.v, sub: jornadaLabel(dayWins.k).replace(/^[^,]+, /, '') });
  if (bigDay && bigDay.v > 1) recs.push({ ic: '📅', t: 'Jornada con más partidas', who: jornadaLabel(bigDay.k).replace(/^[^,]+, /, ''), val: bigDay.v + ' partidas' });
  return recs;
}

let AV = { tab: 'ranking', period: 'all', open: null };
function openArchive(tab) {
  if (typeof tab === 'string') AV.tab = tab;
  const done = doneGames();
  const now = new Date();
  const inPeriod = ts => { const d = new Date(ts - JORNADA_HOUR * 3600e3); return AV.period === 'all' || (AV.period === 'year' && d.getFullYear() === now.getFullYear()) || (AV.period === 'month' && d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth()); };
  const tabs = `<div class="kinds" style="margin:0 0 12px">${[['ranking', '🏆 Ranking'], ['jornadas', '📅 Jornadas'], ['records', '🏅 Récords'], ['partidas', '📜 Partidas']].map(([k, l]) => `<button data-tab="${k}" class="${AV.tab === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  let body = '';
  const SH = {};
  const pRow = (o, i, cols) => `<tr data-player="${esc(o.name)}" style="cursor:pointer"><td>${medal(i)}</td><td style="text-align:left;font-weight:700;text-decoration:underline;text-decoration-color:var(--line)">${esc(o.name)}${cols.prov && o.pj < RANK_MIN ? ' <small class="mut">*</small>' : ''}</td>${cols.cells(o)}</tr>`;
  if (!S.archive.length) {
    body = `<div class="empty">Aún no hay partidas guardadas.<br>Se guardan solas al terminar cada partida.</div>`;
  } else if (AV.tab === 'ranking') {
    const list = aggregate(done.filter(x => inPeriod(x.r.ts)).map(x => x.r)).sort((a, b) => (b.rating - a.rating) || (b.g - a.g) || (b.pj - a.pj));
    const pl = { all: 'Desde siempre', year: 'Año ' + now.getFullYear(), month: now.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }) }[AV.period];
    SH.rank = { file: 'parchis-ranking.png', text: 'Ranking de Parchís 🏆', img: { title: 'Ranking de jugadores', subtitle: pl.charAt(0).toUpperCase() + pl.slice(1),
      cols: ['#', 'Jugador', 'Valor.', 'PJ', 'G', '% G'], rows: list.slice(0, 12).map((o, i) => [medal(i), o.name, Math.round(o.rating * 10), o.pj, o.g, Math.round(o.g / o.pj * 100) + '%']),
      note: 'Valoración 0–100: media por partida ajustada por partidas jugadas.' } };
    body = `<div class="kinds" style="margin:0 0 10px">${[['all', 'Siempre'], ['year', 'Este año'], ['month', 'Este mes']].map(([k, l]) => `<button data-period="${k}" class="${AV.period === k ? 'on' : ''}">${l}</button>`).join('')}</div>` +
      (list.length ? `<div class="tbl-wrap"><table><thead><tr><th>#</th><th style="text-align:left">Jugador</th><th>Valor.</th><th>PJ</th><th>G</th><th>% G</th><th>Pos. media</th><th>🍽</th></tr></thead><tbody>` +
        list.map((o, i) => pRow(o, i, { prov: true, cells: o => `<td><b style="color:var(--gold);font-size:calc(16px * var(--fs, 1))">${Math.round(o.rating * 10)}</b></td><td>${o.pj}</td><td>${o.g}</td><td>${Math.round(o.g / o.pj * 100)}%</td><td>${fmt1(o.avgPos)}º</td><td>${o.comidas || ''}</td>` })).join('') +
        `</tbody></table></div>
        <div class="mut" style="margin-top:6px">Toca un jugador para ver su ficha.${list.some(o => o.pj < RANK_MIN) ? ' * Menos de ' + RANK_MIN + ' partidas: valoración provisional.' : ''}</div>
        <button class="btn-ghost" data-share="rank" style="width:100%;margin-top:10px">📤 Compartir ranking como imagen</button>
        <details class="sec" style="margin-top:10px"><summary style="cursor:pointer;font-weight:700">¿Cómo se calcula?</summary>
          <div class="mut" style="margin-top:8px;line-height:1.5">
          • En cada partida se reparten <b>10 puntos al ganador y 0 al último</b>; el resto según su puesto (va por delante quien tiene sus fichas más avanzadas). Así cuenta igual una partida de 2 que de 4 jugadores.<br>
          • La máquina ocupa su puesto en la partida, pero no sale en el ranking.<br>
          • La <b>valoración</b> (0–100) es la media de puntos por partida, ajustada por el número de partidas jugadas: con pocas partidas se acerca a la media del grupo, y según juegas más refleja tu nivel real.<br>
          • PJ = partidas jugadas · G = ganadas · Pos. media = puesto medio · 🍽 = fichas comidas.<br>
          • Solo cuentan las partidas terminadas.</div></details>`
        : '<div class="empty">No hay partidas terminadas en este periodo.</div>');
  } else if (AV.tab === 'jornadas') {
    const byDay = {};
    done.forEach(x => { const k = jornadaKey(x.r.ts); (byDay[k] = byDay[k] || []).push(x.r); });
    const days = Object.keys(byDay).sort().reverse();
    if (AV.open == null && days.length) AV.open = days[0];
    body = days.length ? days.map(k => {
      const res = byDay[k], list = aggregate(res).sort((a, b) => (b.pts - a.pts) || (b.g - a.g) || (a.avgPos - b.avgPos));
      const isOpen = AV.open === k, lead = list[0];
      SH['j' + k] = { file: 'parchis-jornada-' + k + '.png', text: 'Resultado de la jornada de Parchís 🎲', img: { title: 'Jornada · ' + jornadaLabel(k).replace(/ de \d{4}$/, ''), subtitle: res.length + ' partida' + (res.length === 1 ? '' : 's') + (lead ? ' · 🏆 ' + lead.name : ''),
        cols: ['#', 'Jugador', 'Pts', 'PJ', 'G', 'Pos.'], rows: list.slice(0, 12).map((o, i) => [medal(i), o.name, fmt1(o.pts), o.pj, o.g, fmt1(o.avgPos) + 'º']),
        note: 'Puntos por partida: 10 al ganador, 0 al último.' } };
      return `<div class="hrow" style="padding:0;overflow:hidden">
        <div class="top" data-day="${k}" style="padding:12px;cursor:pointer"><div class="n">${esc(jornadaLabel(k))}<small>${res.length} partida${res.length === 1 ? '' : 's'}${lead ? ` · 🏆 ${esc(lead.name)} (${fmt1(lead.pts)} pts)` : ''}</small></div><span>${isOpen ? '▾' : '▸'}</span></div>
        ${isOpen && list.length ? `<div class="tbl-wrap" style="border-radius:0"><table><thead><tr><th>#</th><th style="text-align:left">Jugador</th><th>Pts</th><th>PJ</th><th>G</th><th>Pos. media</th><th>🍽</th></tr></thead><tbody>` +
          list.map((o, i) => pRow(o, i, { cells: o => `<td><b style="color:var(--gold)">${fmt1(o.pts)}</b></td><td>${o.pj}</td><td>${o.g}</td><td>${fmt1(o.avgPos)}º</td><td>${o.comidas || ''}</td>` })).join('') +
          `</tbody></table></div><div style="padding:10px"><button class="btn-ghost" data-share="j${k}" style="width:100%">📤 Compartir jornada como imagen</button></div>` : ''}
      </div>`;
    }).join('') + '<div class="mut">Puntos por partida: 10 al ganador, 0 al último y el resto según su puesto. La jornada va de 6:00 a 6:00.</div>'
      : '<div class="empty">Aún no hay partidas terminadas.</div>';
  } else if (AV.tab === 'records') {
    const recs = computeRecords();
    SH.records = { file: 'parchis-records.png', text: 'Récords de Parchís 🏅', img: { title: 'Récords', subtitle: done.length + ' partidas jugadas',
      cols: ['', 'Récord', 'Valor'], rows: recs.slice(0, 12).map(r => [r.ic, r.t + ': ' + r.who, r.val]), note: '' } };
    body = recs.length ? recs.map(r => `<div class="hrow"><div class="top"><div style="font-size:calc(24px * var(--fs, 1));width:34px;text-align:center">${r.ic}</div>
        <div class="n">${esc(r.t)}<small>${esc(r.who)}${r.sub ? ' · ' + esc(r.sub) : ''}</small></div>
        <b style="color:var(--gold);white-space:nowrap">${esc(String(r.val))}</b></div></div>`).join('') +
      '<button class="btn-ghost" data-share="records" style="width:100%;margin-top:6px">📤 Compartir récords como imagen</button>'
      : '<div class="empty">Aún no hay partidas terminadas.</div>';
  } else {
    body = archiveHtml(S.archive.length) + `<div class="mut" style="margin:6px 0">Caben hasta ${MAX_ARCHIVE} partidas; al superarlas se borra la más antigua.</div>` +
      (isNative() ? `<div class="hrow mut" style="line-height:1.45">💾 <b>Copia automática:</b> ${S.lastAutoBackup ? 'última el ' + new Date(S.lastAutoBackup).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : 'se hará al terminar la próxima partida'}.
        Se guarda en la app (Android la incluye en tu copia de Google)${S.autoBackupDocs ? ' y en la carpeta <b>Documentos/Parchis</b> del móvil' : ''}.
        Para pasar las partidas a otro móvil, usa también «Exportar».</div>` : '');
  }
  openModal(`<h3>📊 Clasificación y partidas</h3><div class="sub">${S.archive.length} partida${S.archive.length === 1 ? '' : 's'} guardada${S.archive.length === 1 ? '' : 's'}.</div>
    ${S.archive.length ? tabs : ''}${body}
    ${AV.tab === 'partidas' || !S.archive.length ? `<div class="pf-t" style="margin-top:14px">👥 Jugar en grupo</div>
      <div class="mut" style="margin-bottom:8px;line-height:1.45">Para que todos tengáis el mismo historial y ranking: quien tenga las partidas las envía al grupo y los demás las reciben. Las partidas que ya tengas no se duplican.</div>
      <div class="menu">${S.archive.length ? '<button id="aGrp" class="btn-gold">📤 Enviar mis partidas al grupo</button>' : ''}<button id="aImp">📥 Recibir partidas del grupo (o una copia)</button>
      ${S.archive.length ? '<button id="aExp">💾 Guardar copia de seguridad</button>' : ''}</div>` : ''}
    <div class="acts"><button class="btn-gold" id="aC">Cerrar</button></div>`);
  $('#aC').onclick = closeModal;
  const ex = $('#aExp'); if (ex) ex.onclick = () => exportBackup(false);
  const gr = $('#aGrp'); if (gr) gr.onclick = () => exportBackup(true);
  const im = $('#aImp'); if (im) im.onclick = importBackup;
  document.querySelectorAll('#modal [data-tab]').forEach(b => b.onclick = () => openArchive(b.dataset.tab));
  document.querySelectorAll('#modal [data-period]').forEach(b => b.onclick = () => { AV.period = b.dataset.period; openArchive(); });
  document.querySelectorAll('#modal [data-day]').forEach(b => b.onclick = () => { AV.open = AV.open === b.dataset.day ? '' : b.dataset.day; openArchive(); });
  document.querySelectorAll('#modal [data-player]').forEach(tr => tr.onclick = () => openPlayer(tr.dataset.player, () => openArchive()));
  document.querySelectorAll('#modal [data-share]').forEach(b => b.onclick = () => { const d = SH[b.dataset.share]; if (d) shareImage(drawShareImage(d.img), d.file, d.text); });
  document.querySelectorAll('#modal [data-arch]').forEach(el => el.onclick = () => showArchived(+el.dataset.arch));
}

/* ---------- Menú ---------- */
$('#menuBtn').onclick = () => {
  const g = S.game, live = g && g.st.fase !== 'fin', onl = !g && ON.sala && ON.sala.estado === 'jugando';
  openModal(`<h3>Menú</h3><div class="menu">
      ${(() => { const h = `${live || onl ? `<button id="mLeave">🚪 Salir de la partida</button>` : ''}
      ${g && !live ? '<button id="mNew" class="btn-gold">✚ Nueva partida</button>' : ''}`; return h.trim() ? '<div class="mt">Esta partida</div>' + h : ''; })()}
      <div class="mt">Partidas</div>
      <button id="mArch">📊 Clasificación y partidas</button>
      <button id="mRoster">👥 Jugadores habituales</button>
      <div class="mt">Ajustes y ayuda</div>
      <div class="mg2"><button id="mTheme">🎨 Colores, tablero y sonido</button><button id="mLang">🌐 Idioma · Language</button><button id="mHelp">❓ Cómo se usa</button><button id="mGameRules">📖 Reglas del parchís</button></div>
      <div class="mt">La app</div>
      ${isIOS() && !isStandalone() && !isNative() ? '<button id="mIOS" class="btn-gold">📲 Instalar en el iPhone</button>' : ''}
      ${isPlay() || !isNative() ? '' : hasUpd() ? `<button id="mUpd" class="btn-gold">🎉 Actualizar a v${esc(S.updAvail.v)} (nueva)</button>` : '<button id="mUpd">🔄 Buscar actualizaciones</button>'}
      <div class="mg2"><button id="mShareApp">📲 Compartir la app</button><button id="mMas">🎲 Más juegos de IT Canarias</button><button id="mAbout">ℹ️ Acerca de</button>${g ? '' : '<button id="mWipe">🗑 Borrar datos…</button>'}</div>
      <button class="btn-ghost" id="mClose">Cerrar</button></div>`);
  const on = (id, fn) => { const el = $('#' + id); if (el) el.onclick = fn; };
  on('mClose', closeModal);
  on('mHelp', () => openWelcome(0));
  on('mGameRules', openGameRules);
  on('mWipe', openWipe);
  on('mTheme', openThemes);
  on('mUpd', () => hasUpd() ? openUpdAvail() : checkUpdates(true));
  on('mRoster', openRoster);
  on('mLang', () => Idioma.elegir());
  on('mMas', () => MasJuegos.abrir());
  on('mShareApp', () => { closeModal(); shareApp(); });
  on('mIOS', () => openIOSInstall(true));
  on('mArch', () => openArchive('ranking'));
  on('mNew', () => { closeModal(); S.game = null; render(); });
  on('mLeave', () => S.game ? openLeave() : leaveOnline());
  on('mAbout', () => {
    openModal(`<h3>Parchís</h3>
      <div class="sub">v${APP_VERSION}<br>© 2026 IT Canarias. Todos los derechos reservados.<br>itcanarias.com<br><br>Tablero, reglas y máquina propios de IT Canarias.</div>
      <details class="hrow" style="margin-bottom:10px"><summary style="cursor:pointer;font-weight:700">🔒 Privacidad</summary>
        <div class="mut" style="margin-top:8px;line-height:1.5">
        • Tus partidas, jugadores y ajustes se guardan <b>solo en este móvil</b>. No hay cuentas ni registro.<br>
        • La app <b>no recoge ningún dato personal</b> ni de uso, y no lleva anuncios ni rastreadores.<br>
        ${!isNative() ? '• Esta es la <b>versión web</b>: se carga desde GitHub Pages (csuarezsm.github.io) y se actualiza sola al abrirla, sin enviar ningún dato tuyo. Instalada en la pantalla de inicio funciona sin conexión.<br>' : isPlay() ? '• La app <b>no necesita internet</b> para funcionar ni envía ningún dato. Las actualizaciones llegan por Google Play.<br>' : '• Solo se conecta a internet para <b>buscar actualizaciones</b> en GitHub (no envía ningún dato tuyo; como cualquier web, GitHub ve la dirección IP de la conexión) y, si tú lo pulsas, para abrir PayPal o compartir.<br>'}
        ${ONLINE_URL ? '• Solo si juegas <b>en línea</b>, se envían al servidor de juegos de IT Canarias el nombre que pones y tus jugadas, para la partida (el dado lo tira el servidor). No se guardan.<br>' : ''}
        • La copia de seguridad automática se queda en el móvil; Android puede incluirla en tu copia de Google si la tienes activada.<br>
        • Al instalarla y al actualizarla, la app avisa de forma <b>anónima</b> al servidor de IT Canarias para contar instalaciones: solo el juego, el tipo de app (Android, iPhone o web) y la versión. Ningún dato tuyo ni identificador.<br>
        • Responsable: IT Canarias · itcanarias.com</div></details>
      ${isPlay() ? '' : `<div class="donate">
        <div class="dt">💛 Apoya el desarrollo de esta app</div>
        <div class="dd">Es gratis y sin anuncios. Con 1&nbsp;€ nos ayudas a seguir mejorándola y a crear nuevas apps como esta. ¡Gracias!</div>
        <button class="btn-gold" id="donate">Apoyar con 1 € (PayPal)</button>
      </div>`}
      <div class="acts"><button class="btn-ghost" id="ok">Cerrar</button></div>`);
    $('#ok').onclick = closeModal;
    if ($('#donate')) $('#donate').onclick = () => openExternal(DONATE_URL);
  });
};

function openLeave() {
  openModal(`<h3>🚪 Salir de la partida</h3><div class="sub">La partida no está terminada. Si sales sin descartarla, la tienes aquí la próxima vez que abras la app.</div><div class="menu">
    <button id="lvDel" class="btn-red">Abandonar la partida<br><small>No se guarda ni cuenta para la clasificación</small></button></div>
    <div class="acts"><button class="btn-gold" id="lvNo">Seguir jugando</button></div>`);
  $('#lvNo').onclick = closeModal;
  $('#lvDel').onclick = () => { closeModal(); clearTimeout(AIT); BUSY = false; S.game = null; render(); toast('Partida abandonada'); };
}
/* Botón «atrás» de Android: cierra lo que esté abierto o vuelve a la pantalla anterior.
   Devuelve false si ya no hay nada que cerrar (entonces la app se va al fondo). */
function goBack() {
  if (!$('#modal').classList.contains('hidden')) { closeModal(); return true; }
  if (S.game && S.game.st.fase === 'fin') { S.game = null; render(); return true; }
  if (S.game) { openLeave(); return true; }
  if (ON.sala) { if (ON.sala.estado === 'jugando') leaveOnline(); else onEnviar({ t: 'salir' }); return true; }
  if (S.draft.mode !== 'ai') { S.draft.mode = 'ai'; render(); return true; }
  return false;
}
try {
  const AppP = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
  if (AppP && AppP.addListener) AppP.addListener('backButton', () => { if (!goBack()) { if (AppP.minimizeApp) AppP.minimizeApp().catch(() => AppP.exitApp()); else AppP.exitApp(); } });
} catch (e) {}

/* ================= Arranque ================= */
applyTheme(S.theme);
applyFont();
refreshUpdBadge();
setTimeout(autoCheckUpdates, 2500);
// primero, si se ha reinstalado, ofrecer recuperar la copia; si no, la bienvenida a quien empieza
setTimeout(async () => {
  try { await offerRestore(); } catch (e) {}
  if (!S.onboarded) {
    if (S.archive.length || S.game) { S.onboarded = true; save(); }
    else if ($('#modal').classList.contains('hidden')) openWelcome(0);
  }
  if ($('#modal').classList.contains('hidden')) openIOSInstall(false);
}, 400);
// En la versión web, pedir al navegador que no borre los datos de la app
try { if (!isNative() && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') autoBackup(false); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') autoCheckUpdates(); });
if (S.game && !cleanLive(S.game) && !(S.game.st && S.game.st.fase === 'fin')) S.game = null;   // partida guardada dañada
render();
if (S.game) keepAwake();
if ('serviceWorker' in navigator && isNative()) {
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
  if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
} else if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
